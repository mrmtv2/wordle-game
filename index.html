<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Угадай слово</title>
<style>
  :root {
    --bg: #121213; --tile-border: #3a3a3c; --text: #ffffff;
    --green: #538d4e; --yellow: #b59f3b; --gray: #3a3a3c; --key-bg: #818384;
  }
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 10px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  h1 { font-size: 20px; margin: 4px 0 10px; letter-spacing: 1px; text-transform: uppercase; }
  .setup-card {
    background: #1e1e20; border-radius: 16px; padding: 18px; width: 100%; max-width: 380px;
    text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4); margin-top: 15px;
  }
  .btn-group { display: flex; gap: 8px; justify-content: center; margin: 12px 0 18px; }
  .opt-btn {
    flex: 1; padding: 12px 6px; border: 2px solid #3a3a3c; border-radius: 12px;
    background: #272729; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .opt-btn.active { border-color: var(--green); background: rgba(83, 141, 78, 0.25); }
  .start-btn {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: var(--green); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 420px; flex: 1; }
  .top-bar { display: flex; justify-content: space-between; width: 100%; font-size: 13px; color: #aaa; margin-bottom: 8px; }
  .board { display: grid; gap: 5px; margin: auto 0; padding: 6px; }
  .row { display: flex; gap: 5px; justify-content: center; }
  .tile {
    border: 2px solid var(--tile-border); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; text-transform: uppercase; transition: transform 0.2s, background 0.25s;
  }
  .tile.filled { border-color: #666; transform: scale(1.04); }
  .tile.green { background: var(--green); border-color: var(--green); }
  .tile.yellow { background: var(--yellow); border-color: var(--yellow); }
  .tile.gray { background: var(--gray); border-color: var(--gray); }
  .keyboard { width: 100%; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .kb-row { display: flex; gap: 4px; justify-content: center; }
  .key {
    flex: 1; height: 44px; border: none; border-radius: 6px; background: var(--key-bg);
    color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; padding: 0;
  }
  .key.wide { flex: 1.6; font-size: 12px; background: #565758; }
  .key.green { background: var(--green); }
  .key.yellow { background: var(--yellow); }
  .key.gray { background: #262628; color: #777; }
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82);
    align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal-box {
    background: #1e1e20; border-radius: 18px; padding: 22px; max-width: 340px; width: 100%;
    text-align: center; border: 1px solid #3a3a3c; position: relative; z-index: 102;
  }
  .modal-box h2 { margin-top: 0; font-size: 20px; }
  .modal-box p { line-height: 1.45; font-size: 15px; color: #ddd; }
  .modal-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  #fw-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 101; }
</style>
</head>
<body>

<canvas id="fw-canvas"></canvas>
<h1>✨ Угадай слово ✨</h1>

<div id="setup-screen" class="setup-card">
  <div><b>1. Выбери длину слова:</b></div>
  <div class="btn-group" id="len-group">
    <button class="opt-btn" onclick="selectLen(4, this)">4 буквы</button>
    <button class="opt-btn active" onclick="selectLen(5, this)">5 букв</button>
    <button class="opt-btn" onclick="selectLen(6, this)">6 букв</button>
  </div>
  <div><b>2. Выбери сложность:</b></div>
  <div class="btn-group" id="diff-group">
    <button class="opt-btn" onclick="selectDiff('easy', this)">🟢 Лёгкий</button>
    <button class="opt-btn active" onclick="selectDiff('medium', this)">🟡 Средний</button>
    <button class="opt-btn" onclick="selectDiff('hard', this)">🔴 Сложный</button>
  </div>
  <button class="start-btn" onclick="startGame()">Начать игру 🎮</button>
</div>

<div id="game-screen">
  <div class="top-bar">
    <span id="info-label">5 букв • Средний</span>
    <span onclick="backToMenu()" style="color:#538d4e;cursor:pointer;font-weight:700;">⚙️ Сменить</span>
  </div>
  <div id="board" class="board"></div>
  <div id="keyboard" class="keyboard"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <h2 id="modal-title">Победа!</h2>
    <p id="modal-text"></p>
    <div class="modal-btns">
      <button class="start-btn" onclick="shareResult()">📤 Поделиться в чате</button>
      <button class="opt-btn" onclick="startGame()">🔄 Сыграть ещё</button>
      <button class="opt-btn" onclick="backToMenu()">⚙️ В меню</button>
    </div>
  </div>
</div>

<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>
