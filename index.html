<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Угадай слово</title>
<style>
  :root {
    --bg: #0b1120; --card: rgba(30, 41, 59, 0.78); --tile-border: #334155; --text: #f8fafc;
    --green: #10b981; --yellow: #f59e0b; --gray: #334155; --key-bg: #475569; --accent: #38bdf8;
  }
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 18px 14px;
    background:
      radial-gradient(circle at 20% 15%, rgba(56, 189, 248, 0.14) 0%, transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(16, 185, 129, 0.14) 0%, transparent 45%),
      linear-gradient(180deg, #0f172a 0%, #090d16 100%);
    color: var(--text); font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    min-height: 100vh; overflow-x: hidden;
  }
  .header { text-align: center; margin-top: 8px; width: 100%; }
  .subtitle-top { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #64748b; margin-bottom: 4px; font-weight: 700; }
  .header h1 {
    font-family: Georgia, 'Times New Roman', serif; font-size: 27px; font-weight: 700;
    margin: 0; letter-spacing: 2px;
    background: linear-gradient(90deg, #e2e8f0 0%, #7dd3fc 50%, #6ee7b7 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .divider {
    width: 90px; height: 2px; margin: 8px auto 10px;
    background: linear-gradient(90deg, transparent, #38bdf8, transparent);
  }
  .streak-badge {
    display: inline-block; padding: 5px 14px; border-radius: 20px;
    background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(125, 211, 252, 0.25);
    font-size: 12px; color: #bae6fd; font-weight: 600;
  }
  .card {
    background: var(--card); backdrop-filter: blur(12px);
    border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 24px;
    padding: 26px 22px; width: 100%; max-width: 380px; text-align: center;
    box-shadow: 0 20px 45px rgba(0,0,0,0.55); animation: fadeIn 0.45s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .cat-box {
    width: 110px; height: 110px; margin: 0 auto 14px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #334155 0%, #0f172a 100%);
    border: 2px solid rgba(125, 211, 252, 0.45); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45); overflow: hidden;
  }
  .welcome-text { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 24px; color: #f1f5f9; }
  .section-title { font-size: 12px; color: #94a3b8; margin-bottom: 10px; font-weight: 700; letter-spacing: 1.2px; }
  .btn-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
  .opt-btn {
    flex: 1; padding: 13px 6px; border: 1.5px solid #334155; border-radius: 14px;
    background: rgba(15, 23, 42, 0.8); color: #cbd5e1; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.25s;
  }
  .opt-btn.active {
    border-color: var(--green); background: rgba(16, 185, 129, 0.2); color: #fff;
    box-shadow: 0 0 18px rgba(16, 185, 129, 0.25);
  }
  .start-btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer;
    box-shadow: 0 8px 22px rgba(16, 185, 129, 0.35);
  }
  .footer-note { font-size: 12px; color: #475569; margin-bottom: 6px; letter-spacing: 0.5px; }
  #setup-screen, #game-screen { display: none; }
  #game-screen { flex-direction: column; align-items: center; width: 100%; max-width: 420px; flex: 1; justify-content: space-between; }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    background: rgba(30, 41, 59, 0.75); padding: 9px 14px; border-radius: 12px;
    font-size: 13px; color: #e2e8f0; margin-top: 8px; border: 1px solid #334155; font-weight: 600;
  }
  .board { display: grid; gap: 6px; margin: auto 0; padding: 6px; }
  .row { display: flex; gap: 6px; justify-content: center; }
  .tile {
    border: 2px solid var(--tile-border); border-radius: 10px; background: rgba(15, 23, 42, 0.7);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; text-transform: uppercase; transition: transform 0.2s, background 0.25s;
  }
  .tile.filled { border-color: var(--accent); transform: scale(1.05); }
  .tile.green { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }
  .tile.yellow { background: var(--yellow); border-color: var(--yellow); color: #0f172a; }
  .tile.gray { background: var(--gray); border-color: var(--gray); color: #94a3b8; }
  .keyboard { width: 100%; margin-bottom: 4px; display: flex; flex-direction: column; gap: 6px; }
  .kb-row { display: flex; gap: 4px; justify-content: center; }
  .key {
    flex: 1; height: 45px; border: none; border-radius: 8px; background: var(--key-bg);
    color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; padding: 0;
  }
  .key.wide { flex: 1.65; font-size: 12px; background: #334155; }
  .key.green { background: var(--green); }
  .key.yellow { background: var(--yellow); color: #0f172a; }
  .key.gray { background: #1e293b; color: #64748b; }

  /* Медленная, плавная шторка Котика в очках (1.1 сек вниз и 1.1 сек вверх) */
  .banner-drop {
    position: fixed; top: 0; left: 0; right: 0; height: 48vh; min-height: 260px;
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
    border-bottom: 1.5px solid rgba(125, 211, 252, 0.4); border-radius: 0 0 30px 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center; z-index: 150;
    transform: translateY(-110%); transition: transform 1.1s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .banner-drop.show { transform: translateY(0); }
  .banner-phrase { font-size: 23px; font-weight: 800; color: #fff; margin-top: 6px; }
  .banner-sub { font-size: 14px; color: #94a3b8; margin-top: 6px; }

  .modal {
    display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal-box {
    background: #1e293b; border-radius: 24px; padding: 24px; max-width: 340px; width: 100%;
    text-align: center; border: 1px solid #475569; position: relative; z-index: 102;
  }
  .modal-box h2 { margin: 6px 0 8px; font-size: 22px; }
  .modal-box p { line-height: 1.5; font-size: 15px; color: #e2e8f0; }
  .modal-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  #fw-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 103; }
</style>
</head>
<body>

<canvas id="fw-canvas"></canvas>

<div id="cat-banner" class="banner-drop">
  <div class="cat-box cat-art"></div>
  <div id="banner-title" class="banner-phrase">Ты что, профи?</div>
  <div id="banner-sub" class="banner-sub">Удачи в игре!</div>
</div>

<div class="header">
  <div class="subtitle-top">ИНТЕЛЛЕКТУАЛЬНАЯ ИГРА</div>
  <h1>УГАДАЙ СЛОВО</h1>
  <div class="divider"></div>
  <div id="streak-info" class="streak-badge">🔥 Серия побед: 0</div>
</div>

<div id="welcome-screen" class="card">
  <div class="cat-box cat-art"></div>
  <div id="welcome-msg" class="welcome-text">Привет! Ну что, поиграем?</div>
  <button class="start-btn" onclick="openSetup()">Поехали ✨</button>
</div>

<div id="setup-screen" class="card">
  <div class="section-title">1. ДЛИНА СЛОВА</div>
  <div class="btn-group" id="len-group">
    <button class="opt-btn" onclick="selectLen(4, this)">4 буквы</button>
    <button class="opt-btn active" onclick="selectLen(5, this)">5 букв</button>
    <button class="opt-btn" onclick="selectLen(6, this)">6 букв</button>
  </div>
  <div class="section-title">2. СЛОЖНОСТЬ</div>
  <div class="btn-group" id="diff-group">
    <button class="opt-btn" onclick="selectDiff('easy', this)">🟢 Лёгкий</button>
    <button class="opt-btn active" onclick="selectDiff('medium', this)">🟡 Средний</button>
    <button class="opt-btn" onclick="selectDiff('hard', this)">🔴 Сложный</button>
  </div>
  <button class="start-btn" onclick="startGame()">Начать игру</button>
</div>

<div id="game-screen">
  <div class="top-bar">
    <span id="info-label">5 букв • Средний (8 поп.)</span>
    <span onclick="backToMenu()" style="color:#7dd3fc;cursor:pointer;font-weight:700;">⚙️ Сменить</span>
  </div>
  <div id="board" class="board"></div>
  <div id="keyboard" class="keyboard"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <div class="cat-box cat-art" style="width:88px;height:88px;"></div>
    <h2 id="modal-title">Победа!</h2>
    <p id="modal-text"></p>
    <div class="modal-btns">
      <button class="start-btn" onclick="shareResult()">📤 Поделиться в чате</button>
      <button class="opt-btn" onclick="startGame()">🔄 Сыграть ещё</button>
      <button class="opt-btn" onclick="backToMenu()">⚙️ В меню</button>
    </div>
  </div>
</div>

<div id="footer-note" class="footer-note">Сделано с любовью для уютных вечеров ✨</div>

<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>
