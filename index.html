<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Угадай слово</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --tile-border: #334155; --text: #f8fafc;
    --green: #10b981; --yellow: #f59e0b; --gray: #334155; --key-bg: #475569; --accent: #38bdf8;
  }
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 12px; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
  }
  .header { text-align: center; margin: 4px 0 12px; }
  .header h1 {
    font-size: 22px; margin: 0; letter-spacing: 1.5px; text-transform: uppercase;
    background: linear-gradient(90deg, #38bdf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .streak-badge {
    display: inline-block; margin-top: 6px; padding: 4px 12px; border-radius: 20px;
    background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3);
    font-size: 12px; color: #7dd3fc; font-weight: 600;
  }
  .card {
    background: rgba(30, 41, 59, 0.92); border: 1px solid #334155; border-radius: 22px;
    padding: 24px 20px; width: 100%; max-width: 380px; text-align: center;
    box-shadow: 0 14px 35px rgba(0,0,0,0.5); animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .welcome-emoji { font-size: 46px; margin-bottom: 10px; }
  .welcome-text { font-size: 19px; font-weight: 700; line-height: 1.45; margin-bottom: 22px; color: #f1f5f9; }
  .section-title { font-size: 13px; color: #94a3b8; margin-bottom: 10px; font-weight: 700; letter-spacing: 0.5px; }
  .btn-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .opt-btn {
    flex: 1; padding: 13px 6px; border: 2px solid #334155; border-radius: 14px;
    background: #0f172a; color: #cbd5e1; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s;
  }
  .opt-btn.active {
    border-color: var(--green); background: rgba(16, 185, 129, 0.2); color: #fff;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);
  }
  .start-btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
    box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
  }
  #setup-screen, #game-screen { display: none; }
  #game-screen { flex-direction: column; align-items: center; width: 100%; max-width: 420px; flex: 1; }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    background: rgba(30, 41, 59, 0.75); padding: 9px 14px; border-radius: 12px;
    font-size: 13px; color: #e2e8f0; margin-bottom: 10px; border: 1px solid #334155; font-weight: 600;
  }
  .board { display: grid; gap: 6px; margin: auto 0; padding: 4px; }
  .row { display: flex; gap: 6px; justify-content: center; }
  .tile {
    border: 2px solid var(--tile-border); border-radius: 10px; background: rgba(15, 23, 42, 0.65);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; text-transform: uppercase; transition: transform 0.2s, background 0.25s;
  }
  .tile.filled { border-color: var(--accent); transform: scale(1.05); }
  .tile.green { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }
  .tile.yellow { background: var(--yellow); border-color: var(--yellow); color: #0f172a; }
  .tile.gray { background: var(--gray); border-color: var(--gray); color: #94a3b8; }
  .keyboard { width: 100%; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .kb-row { display: flex; gap: 4px; justify-content: center; }
  .key {
    flex: 1; height: 45px; border: none; border-radius: 8px; background: var(--key-bg);
    color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; padding: 0;
  }
  .key.wide { flex: 1.65; font-size: 12px; background: #334155; }
  .key.green { background: var(--green); }
  .key.yellow { background: var(--yellow); color: #0f172a; }
  .key.gray { background: #1e293b; color: #64748b; }
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal-box {
    background: #1e293b; border-radius: 22px; padding: 24px; max-width: 340px; width: 100%;
    text-align: center; border: 1px solid #475569; position: relative; z-index: 102;
  }
  .modal-box h2 { margin-top: 0; font-size: 22px; }
  .modal-box p { line-height: 1.5; font-size: 15px; color: #e2e8f0; }
  .modal-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  #fw-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 103; }
</style>
</head>
<body>

<canvas id="fw-canvas"></canvas>

<div class="header">
  <h1>✨ Угадай слово ✨</h1>
  <div id="streak-info" class="streak-badge">🔥 Серия побед: 0</div>
</div>

<div id="welcome-screen" class="card">
  <div class="welcome-emoji">💖✨</div>
  <div id="welcome-msg" class="welcome-text">Привет! Ну что, поиграем?</div>
  <button class="start-btn" onclick="openSetup()">Поехали! 🚀</button>
</div>

<div id="setup-screen" class="card">
  <div class="section-title">1. ВЫБЕРИ ДЛИНУ СЛОВА</div>
  <div class="btn-group" id="len-group">
    <button class="opt-btn" onclick="selectLen(4, this)">4 буквы</button>
    <button class="opt-btn active" onclick="selectLen(5, this)">5 букв</button>
    <button class="opt-btn" onclick="selectLen(6, this)">6 букв</button>
  </div>
  <div class="section-title">2. ВЫБЕРИ СЛОЖНОСТЬ</div>
  <div class="btn-group" id="diff-group">
    <button class="opt-btn" onclick="selectDiff('easy', this)">🟢 Лёгкий</button>
    <button class="opt-btn active" onclick="selectDiff('medium', this)">🟡 Средний</button>
    <button class="opt-btn" onclick="selectDiff('hard', this)">🔴 Сложный</button>
  </div>
  <button class="start-btn" onclick="startGame()">Начать игру 🎮</button>
</div>

<div id="game-screen">
  <div class="top-bar">
    <span id="info-label">5 букв • Ммм, не дурно!</span>
    <span onclick="backToMenu()" style="color:#38bdf8;cursor:pointer;font-weight:700;">⚙️ Сменить</span>
  </div>
  <div id="board" class="board"></div>
  <div id="keyboard" class="keyboard"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <h2 id="modal-title">Победа!</h2>
    <p id="modal-text"></p>
    <div class="modal-btns">
      <button class="start-btn" onclick="shareResult()">📤 Поделиться в чате</button>
      <button class="opt-btn" onclick="startGame()">🔄 Сыграть ещё</button>
      <button class="opt-btn" onclick="backToMenu()">⚙️ В меню</button>
    </div>
  </div>
</div>

<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>
